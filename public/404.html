<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · 9990708.xyz</title>
<!-- 为什么要有这个文件：Pages 在站点没有 404.html 时，会给任何不存在的路径
     返回 200 + 首页。对搜索引擎就是「软 404」—— 无数个网址内容相同还都说正常，
     会被判重复内容。有了这一页，不存在就老老实实返回 404。 -->
<style>
  :root{--bg:#07090c;--card:#0d1117;--text:#e9eef4;--muted:#8b98a6;--line:#1b2330;--accent:#4ade9b;color-scheme:dark}
  @media (prefers-color-scheme:light){
    :root{--bg:#f7f6f3;--card:#fff;--text:#14181c;--muted:#5f6b76;--line:#e2dfd7;--accent:#0f766e;color-scheme:light}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--bg);color:var(--text);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  main{max-width:440px;text-align:center}
  .code{font:700 64px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);letter-spacing:-.02em}
  h1{margin:18px 0 10px;font-size:21px}
  p{margin:0 0 26px;color:var(--muted);font-size:14.5px}
  a{display:inline-block;padding:11px 20px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text);text-decoration:none;font-size:14.5px}
  a:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>地址可能打错了，或者那一页已经搬走。<br>Page not found — the address may be mistyped or moved.</p>
  <a href="/">回首页 · Back to home</a>
</main>
</body>
</html>
